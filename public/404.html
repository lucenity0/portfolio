<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>me.lucenity.dev — are you lost?</title>
<meta name="description" content="That page isn't here. Nafees S (lucenity0) — the terminal is back this way." />
<meta name="color-scheme" content="dark" />
<meta property="og:title" content="me.lucenity.dev — are you lost?" />
<meta property="og:description" content="That page isn't here. The sign still points home; the cat is still asleep." />

<style>
  :root {
    --bg:        #0d0d0d;
    --panel:     #111111;
    --line:      #262626;
    --ink:       #f4f4f4;
    --dim:       #9a9a9a;
    --sub:       #6a6a6a;
    --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 4vw, 40px);
    overflow-x: hidden;
  }

  /* faint grid + vignette behind everything */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: .35;
    -webkit-mask-image: radial-gradient(120% 90% at 50% 40%, #000 40%, transparent 100%);
            mask-image: radial-gradient(120% 90% at 50% 40%, #000 40%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 760px;
  }

  .frame {
    border: 3px solid var(--ink);
    border-radius: 16px;
    background: linear-gradient(180deg, #0f0f0f, #0a0a0a);
    padding: clamp(14px, 3vw, 26px);
    position: relative;
    box-shadow: 0 0 0 6px #000, 0 30px 80px -30px #000;
  }
  /* corner brackets */
  .frame::before, .frame::after {
    content: ""; position: absolute; width: 16px; height: 16px; pointer-events: none;
    border-color: var(--dim); border-style: solid;
  }
  .frame::before { top: 8px;  left: 8px;  border-width: 2px 0 0 2px; }
  .frame::after  { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    font-size: 11px; letter-spacing: 2px; color: var(--dim);
    margin-bottom: 14px;
  }
  .topbar .status { display: inline-flex; align-items: center; gap: 8px; }
  .blip {
    width: 8px; height: 8px; background: var(--ink); display: inline-block;
    box-shadow: 0 0 0 0 var(--ink);
  }

  .stage {
    position: relative;
    border: 2px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: #060606;
    aspect-ratio: 160 / 90;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  /* CRT scanlines + soft glow, on top of canvas */
  .stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.28) 2px 3px),
      radial-gradient(120% 120% at 50% 30%, transparent 55%, rgba(0,0,0,.55) 100%);
    mix-blend-mode: multiply;
  }

  .headline {
    margin: 20px 2px 0;
    font-size: clamp(20px, 6vw, 40px);
    font-weight: 800;
    letter-spacing: clamp(2px, 1.2vw, 8px);
    line-height: 1;
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 .35em;
  }
  .headline .caret {
    display: inline-block; width: .55em; height: .95em;
    background: var(--ink); transform: translateY(.06em);
  }
  .sub {
    margin: 12px 2px 0;
    color: var(--dim);
    font-size: clamp(12px, 2.6vw, 14px);
    line-height: 1.5;
    max-width: 52ch;
  }

  /* loading bar */
  .ways {
    margin: 22px 2px 4px;
    display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap;
  }
  .go {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px;
    color: var(--ink); text-decoration: none;
    border: 2px solid var(--ink); border-radius: 6px;
    font-size: 13px; letter-spacing: 1px;
  }
  .go:hover, .go:focus-visible { background: var(--ink); color: var(--bg); }
  .go .arrow { transition: transform .18s ease; }
  .go:hover .arrow { transform: translateX(-3px); }
  .go-alt {
    color: var(--dim); text-decoration: none;
    font-size: 12px; letter-spacing: 1px;
    border-bottom: 1px solid var(--line);
  }
  .go-alt:hover, .go-alt:focus-visible { color: var(--ink); }

  footer {
    margin-top: 22px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    font-size: 11px; letter-spacing: 1px; color: var(--sub);
  }
  footer a { color: var(--dim); text-decoration: none; border-bottom: 1px solid var(--line); }
  footer a:hover { color: var(--ink); border-color: var(--dim); }

  @media (prefers-reduced-motion: no-preference) {
    .blip { animation: blip 1.8s ease-in-out infinite; }
    .caret { animation: caret 1s steps(1) infinite; }
  }
  @keyframes blip {
    0%,100% { box-shadow: 0 0 0 0 rgba(244,244,244,.6); opacity: 1; }
    50%     { box-shadow: 0 0 0 5px rgba(244,244,244,0);  opacity: .55; }
  }
  @keyframes caret { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
</style>

<main>
  <div class="frame">
    <div class="topbar">
      <span>// me.lucenity.dev</span>
      <span class="status"><i class="blip"></i>STATUS: 404 · NOT FOUND</span>
    </div>

    <div class="stage">
      <canvas id="scene" width="160" height="90" aria-label="Pixel-art night scene: a signpost pointing home, a sleeping cat, stars and a crescent moon"></canvas>
    </div>

    <h1 class="headline">ARE YOU LOST?<span class="caret"></span></h1>
    <p class="sub" id="sub">
      that page isn't here. the cat's no help — it's asleep — but the sign
      still points the right way :3
    </p>

    <div class="ways">
      <a class="go" href="/"><span class="arrow" aria-hidden="true">&larr;</span> back to the terminal</a>
      <a class="go-alt" href="https://github.com/lucenity0">or find me on github</a>
    </div>

    <footer>
      <span>© 2026 · liffy · portfolio</span>
      <span><a href="https://github.com/lucenity0">github.com/lucenity0</a></span>
    </footer>
  </div>
</main>

<script>
(() => {
  const cv = document.getElementById('scene');
  const g  = cv.getContext('2d');
  const VW = cv.width, VH = cv.height;      // 160 x 90 virtual pixels
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- monochrome palette (pure greys) --------------------------------
  const C = {
    sky0:'#0a0a0a', sky1:'#121212', ground:'#151515', groundLine:'#2b2b2b',
    far:'#3a3a3a', mid:'#5c5c5c', dim:'#8f8f8f', body:'#cfcfcf',
    light:'#e8e8e8', bright:'#f6f6f6', shadow:'#0d0d0d'
  };
  const px = (x,y,w,h,c) => { g.fillStyle = c; g.fillRect(x|0, y|0, w|0, h|0); };

  // ---- sprite helper: draw a string bitmap -----------------------------
  // map: chars -> colour (space/'.' = transparent)
  function sprite(rows, ox, oy, map, flip=false) {
    for (let r = 0; r < rows.length; r++) {
      const line = rows[r];
      for (let c = 0; c < line.length; c++) {
        const col = map[line[c]];
        if (!col) continue;
        const x = flip ? ox + (line.length - 1 - c) : ox + c;
        px(x, oy + r, 1, 1, col);
      }
    }
  }

  // ---- sleeping cat: head/face on the RIGHT, back sloping down-left,
  //      two closed-eye dashes, a paw poking out at the bottom-left. --------
  // # body   - closed eye   . transparent
  const CAT = [
  "..#.......#...............",
  ".###.....###..............",
  ".#.##....#.##.............",
  ".#..##..##..##............",
  ".#.########..##...........",
  ".################.........",
  ".#################........",
  ".##################.......",
  ".##################.......",
  "###################.......",
  "###################.#####.",
  "##...####...##############",
  "##########################",
  "####################...###",
  ".################.........",
  "..#############...........",
];
  const CATMAP = { '#':C.light, '-':C.shadow };

  // ---- little "Z" glyph (3x5) ------------------------------------------
  const Z = ["###","..#",".#.","#..","###"];
  function drawZ(cx, cy, s, alpha) {
    g.globalAlpha = alpha;
    for (let r=0;r<5;r++) for (let c=0;c<3;c++) if (Z[r][c]==='#') px(cx+c*s, cy+r*s, s, s, C.light);
    g.globalAlpha = 1;
  }

  // ---- static star field ------------------------------------------------
  const stars = [];
  (function seed(){
    let s = 1337;
    const rnd = () => (s = (s*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    for (let i=0;i<34;i++){
      const x = 4 + Math.floor(rnd()*(VW-8));
      const y = 3 + Math.floor(rnd()*44);
      if (x>112 && x<150 && y<26) continue;      // keep clear of the moon
      stars.push({x, y, ph: rnd()*Math.PI*2, sp: .6+rnd()*1.6, big: rnd()>.86});
    }
  })();

  const GROUND_Y = 70;   // horizon line

  function draw(t){
    // sky
    px(0,0,VW,VH,C.sky1);
    px(0,0,VW,42,C.sky0);

    // stars (twinkle)
    for (const st of stars){
      const tw = reduce ? .8 : (0.45 + 0.55*Math.sin(t*0.002*st.sp + st.ph));
      if (tw < 0.28) continue;
      const col = tw > 0.8 ? C.bright : (tw > 0.55 ? C.light : C.mid);
      px(st.x, st.y, 1, 1, col);
      if (st.big && tw > 0.7){ px(st.x-1,st.y,1,1,C.mid); px(st.x+1,st.y,1,1,C.mid); px(st.x,st.y-1,1,1,C.mid); px(st.x,st.y+1,1,1,C.mid); }
    }

    // crescent moon (top-right)
    const mx=132, my=15, mr=8;
    g.fillStyle = C.dim;
    g.beginPath(); g.arc(mx,my,mr,0,Math.PI*2); g.fill();
    g.fillStyle = C.sky0;
    g.beginPath(); g.arc(mx+3.4,my-1.6,mr,0,Math.PI*2); g.fill();
    // a couple moon craters
    px(mx-4,my+2,1,1,C.mid); px(mx-6,my-2,1,1,C.mid);

    // ---- ground ----
    px(0,GROUND_Y,VW,VH-GROUND_Y,C.ground);
    px(0,GROUND_Y,VW,1,C.groundLine);
    // sparse ground texture
    for(let x=3;x<VW;x+=11){ px(x, GROUND_Y+4+((x*7)%5), 1,1,C.far); }

    // ---- signpost: still pointing the way home ----
    (function signpost(){
      const postX = 46, topY = 38;
      px(postX, topY, 2, GROUND_Y - topY, C.mid);     // post
      px(postX - 4, GROUND_Y - 1, 10, 1, C.shadow);   // it stands on something

      const bx = 24, by = topY + 1, bw = 22, bh = 9;
      px(bx + 5, by, bw, bh, C.light);                // the plank
      for(let i=0;i<5;i++){                           // arrow head, tip first
        px(bx + i, by + (4 - i), 1, bh - 2*(4 - i), C.light);
      }
      px(bx + 5, by, bw, 1, C.dim);                   // lit top edge
      px(bx + 5, by + bh - 1, bw, 1, C.shadow);       // shaded underside
      px(bx + 10, by + 4, 7, 1, C.shadow);            // lettering, unreadable
      px(bx + 19, by + 4, 5, 1, C.shadow);            //   at this size
    })();

    // ---- the sleeping cat ----
    const breathe = reduce ? 0 : (Math.sin(t*0.0022) > 0.3 ? -1 : 0);   // gentle 1px rise
    const catX = 94, catY = GROUND_Y - 13 + breathe;
    // soft shadow
    px(catX+3, GROUND_Y-1, 15, 1, C.shadow);
    sprite(CAT, catX, catY, CATMAP);

    // ---- Zzz rising above the cat's head (head is upper-left) ----
    if(!reduce){
      const cyc = 2600;
      for(let i=0;i<3;i++){
        const p = ((t + i*860) % cyc) / cyc;          // 0..1
        const a = p < .18 ? p/.18 : (p > .7 ? (1-p)/.3 : 1);
        drawZ(catX+9 + p*6, (catY-1) - p*16, 1 + (i>1?1:0), Math.max(0,a));
      }
    } else {
      drawZ(catX+11, catY-5, 2, .9);
    }
  }

  if (reduce){
    draw(1800);
  } else {
    const start = performance.now();
    (function loop(now){ draw(now - start); requestAnimationFrame(loop); })(start);
  }

})();
</script>
